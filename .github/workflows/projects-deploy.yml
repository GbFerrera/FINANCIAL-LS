# Build no GitHub Actions → GHCR → redeploy na VPS (sem build no Coolify).
name: Projects — build & deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'obsidian-export/**'
      - 'tmp/**'
      - '**.md'
      - '.cursor/**'
  workflow_dispatch:

concurrency:
  group: projects-prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gbferrera/financial-ls

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXTAUTH_URL=https://projects.linksystem.tech
            NEXTAUTH_SECRET=${{ secrets.PROJECTS_NEXTAUTH_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Publicar scripts de redeploy na VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: root
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          key: ${{ secrets.PROD_SSH_KEY }}
          source: scripts/vps-redeploy-from-ghcr.sh,scripts/coolify-compose-app-service.py
          target: /root/scripts/
          overwrite: true

      - name: Redeploy na VPS (pull GHCR, sem build local)
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:latest
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: root
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            install -m 755 /root/scripts/vps-redeploy-from-ghcr.sh /root/deploy-projects-from-ghcr.sh
            install -m 644 /root/scripts/coolify-compose-app-service.py /root/scripts/coolify-compose-app-service.py 2>/dev/null || true
            export PATCH_SCRIPT=/root/scripts/coolify-compose-app-service.py
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash /root/deploy-projects-from-ghcr.sh "$IMAGE"
