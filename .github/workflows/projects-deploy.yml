# Build no GitHub Actions → GHCR → redeploy em /opt/projects-linksystem (sem Coolify).
name: Projects — build & deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - 'obsidian-export/**'
      - 'tmp/**'
      - '**.md'
      - '.cursor/**'
  workflow_dispatch:

concurrency:
  group: projects-prod-deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: gbferrera/financial-ls

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.meta.outputs.tags }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXTAUTH_URL=https://projects.linksystem.tech
            NEXTAUTH_SECRET=${{ secrets.PROJECTS_NEXTAUTH_SECRET }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Publicar compose e scripts na VPS (via bastion)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: root
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          key: ${{ secrets.PROD_SSH_KEY }}
          proxy_host: ${{ secrets.PROD_SSH_BASTION_HOST }}
          proxy_username: root
          proxy_password: ${{ secrets.PROD_SSH_PASSWORD }}
          proxy_key: ${{ secrets.PROD_SSH_KEY }}
          source: deploy/docker-compose.prod.yml,scripts/vps-deploy-projects-stack.sh,scripts/backup-before-deploy.sh
          target: /opt/projects-linksystem/
          overwrite: true

      - name: Redeploy stack Projects (/opt/projects-linksystem)
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE: ghcr.io/${{ env.IMAGE_NAME }}:latest
          GHCR_USER: ${{ github.repository_owner }}
          GHCR_TOKEN: ${{ secrets.GHCR_READ_TOKEN || secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: root
          password: ${{ secrets.PROD_SSH_PASSWORD }}
          key: ${{ secrets.PROD_SSH_KEY }}
          proxy_host: ${{ secrets.PROD_SSH_BASTION_HOST }}
          proxy_username: root
          proxy_password: ${{ secrets.PROD_SSH_PASSWORD }}
          proxy_key: ${{ secrets.PROD_SSH_KEY }}
          envs: IMAGE,GHCR_USER,GHCR_TOKEN
          script_stop: true
          script: |
            set -euo pipefail
            mkdir -p /opt/projects-linksystem
            if [[ -f /opt/projects-linksystem/deploy/docker-compose.prod.yml ]]; then
              mv /opt/projects-linksystem/deploy/docker-compose.prod.yml /opt/projects-linksystem/docker-compose.prod.yml
              rmdir /opt/projects-linksystem/deploy 2>/dev/null || true
            fi
            for f in vps-deploy-projects-stack.sh backup-before-deploy.sh; do
              if [[ -f /opt/projects-linksystem/scripts/$f ]]; then
                install -m 755 "/opt/projects-linksystem/scripts/$f" "/opt/projects-linksystem/$f"
              fi
            done
            install -m 755 /opt/projects-linksystem/vps-deploy-projects-stack.sh /root/deploy-projects-stack.sh
            chmod 600 /opt/projects-linksystem/.env 2>/dev/null || true
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin
            bash /root/deploy-projects-stack.sh "$IMAGE"
            docker compose -f /opt/projects-linksystem/docker-compose.prod.yml --env-file /opt/projects-linksystem/.env ps
