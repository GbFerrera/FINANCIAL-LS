# LiveKit — produção na VPS (rede coolify + Traefik)
# Domínio: livekit.linksystem.tech
# Subir: docker compose -f docker/livekit/docker-compose.yaml up -d

services:
  livekit:
    image: livekit/livekit-server:latest
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports:
      - "7881:7881"
      - "7882:7882/udp"
    networks:
      - coolify
    labels:
      - traefik.enable=true
      - traefik.docker.network=coolify
      - traefik.http.middlewares.redirect-livekit-https.redirectscheme.scheme=https
      - traefik.http.routers.http-livekit.entryPoints=http
      - traefik.http.routers.http-livekit.middlewares=redirect-livekit-https
      - traefik.http.routers.http-livekit.rule=Host(`livekit.linksystem.tech`)
      - traefik.http.routers.http-livekit.service=livekit
      - traefik.http.routers.https-livekit.entryPoints=https
      - traefik.http.routers.https-livekit.rule=Host(`livekit.linksystem.tech`)
      - traefik.http.routers.https-livekit.tls=true
      - traefik.http.routers.https-livekit.tls.certresolver=letsencrypt
      - traefik.http.routers.https-livekit.service=livekit
      - traefik.http.services.livekit.loadbalancer.server.port=7880

networks:
  coolify:
    external: true
