version: '3.8'

services:
  app:
    build:
      context: .
      args:
        NEXTAUTH_URL: ${NEXTAUTH_URL}
        NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
    restart: unless-stopped
    expose:
      - "3000"
    labels:
      - traefik.docker.network=coolify
    environment:
      - TZ=America/Sao_Paulo
      - DATABASE_URL=postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@${COMPOSE_PROJECT_NAME:-financial}-postgres:5432/${POSTGRES_DB:-financial_ls}?schema=public
      - NEXTAUTH_URL=${NEXTAUTH_URL}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET}
      - SMTP_HOST=${SMTP_HOST}
      - SMTP_PORT=${SMTP_PORT}
      - SMTP_SECURE=${SMTP_SECURE}
      - SMTP_USER=${SMTP_USER}
      - SMTP_PASS=${SMTP_PASS}
      - SMTP_FROM=${SMTP_FROM}
      - FINANCE_DAILY_EMAIL_TO=${FINANCE_DAILY_EMAIL_TO}
      - CRON_SECRET=${CRON_SECRET}
      - REMINDER_CRON_INTERVAL_MS=${REMINDER_CRON_INTERVAL_MS:-300000}
      - EVOLUTION_API_URL=${EVOLUTION_API_URL:-http://evolution-api:8080}
      - EVOLUTION_API_KEY=${EVOLUTION_API_KEY:-dev-evolution-key-change-me}
      - SEED_DB=${SEED_DB:-false}
      - SEED_ADMIN_NAME=${SEED_ADMIN_NAME}
      - SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}
      - SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}
    volumes:
      - ./uploads:/app/uploads
    command: >
      sh -c "npx prisma migrate deploy &&
             if [ \"$SEED_DB\" = \"true\" ]; then npm run db:seed; fi &&
             npm run start"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    networks:
      - app-network
      - coolify

  db:
    image: postgres:15-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5435}:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-financial_ls}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d
    networks:
      app-network:
        aliases:
          - ${COMPOSE_PROJECT_NAME:-financial}-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-financial_ls}"]
      interval: 10s
      timeout: 5s
      retries: 5

  evolution-redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks:
      - app-network

  evolution-api:
    image: evoapicloud/evolution-api:v2.3.7
    restart: unless-stopped
    expose:
      - "8080"
    # Sem ports no host: evita conflito (ex. Coolify já usa 8080). App usa http://evolution-api:8080.
    # Dev local — manager UI: copie docker-compose.override.example.yml → docker-compose.override.yml
    environment:
      SERVER_URL: ${EVOLUTION_PUBLIC_URL:-http://localhost:8080}
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-dev-evolution-key-change-me}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${EVOLUTION_POSTGRES_DB:-evolution}?schema=public
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://evolution-redis:6379/0
      DEL_INSTANCE: "false"
      QRCODE_LIMIT: "30"
      QRCODE_COLOR: "#198754"
      CONFIG_SESSION_PHONE_VERSION: ${EVOLUTION_PHONE_VERSION:-2.3000.1030831524}
      CONFIG_SESSION_PHONE_CLIENT: Chrome
      CONFIG_SESSION_PHONE_NAME: Chrome
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      db:
        condition: service_healthy
      evolution-redis:
        condition: service_started
    networks:
      - app-network

volumes:
  uploads_data:
  postgres_data:
  evolution_instances:

networks:
  app-network:
    name: ${COMPOSE_PROJECT_NAME:-financial}-app-network
    driver: bridge
  coolify:
    external: true
